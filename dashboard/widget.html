<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>cc</title>
<style>
  :root { --bg:#f6f5f2; --panel:#fff; --fg:#1d1c1a; --muted:#77736b; --line:#e4e1da; --accent:#0f766e; --me:#0f766e; --me-fg:#fff;
          --ok:#15803d; --warn:#b45309; --bad:#b91c1c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161514; --panel:#201f1d; --fg:#eeece8; --muted:#a19c93; --line:#34322e; --accent:#2dd4bf; --me:#134e4a; --me-fg:#e6fffb;
            --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 14px/1.45 "Segoe UI", system-ui, sans-serif; display: flex; flex-direction: column; }
  header { padding: 10px 12px 8px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .title { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .title button { margin-left: auto; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; font-size: 12px; color: var(--muted); }
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border: 1px solid var(--line); border-radius: 999px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .ok .dot { background: var(--ok); } .warn .dot { background: var(--warn); } .bad .dot { background: var(--bad); }
  main { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 88%; padding: 8px 11px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; }
  .bot { background: var(--panel); border: 1px solid var(--line); align-self: flex-start; border-bottom-left-radius: 4px; }
  .me { background: var(--me); color: var(--me-fg); align-self: flex-end; border-bottom-right-radius: 4px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px; align-self: stretch; }
  .card video { width: 100%; max-height: 260px; border-radius: 10px; background: #000; display: block; }
  .card .meta { font-size: 12px; color: var(--muted); margin: 6px 0 2px; }
  .card .hook { font-weight: 600; margin-bottom: 6px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  button { font: inherit; font-size: 13px; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .chips { display: flex; gap: 6px; padding: 0 12px 8px; flex-wrap: wrap; }
  .chips button { font-size: 12px; padding: 4px 10px; }
  form { display: flex; gap: 8px; padding: 10px 12px 12px; border-top: 1px solid var(--line); background: var(--panel); }
  input { flex: 1; font: inherit; padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); min-width: 0; }
  .typing { color: var(--muted); font-style: italic; }
  .sr { position: absolute; left: -9999px; }
</style>
</head>
<body>
<header>
  <div class="title"><span>cc · cc-studio</span><button id="pause" type="button" aria-label="Pause or resume the pipeline">Pause</button></div>
  <div class="pills" id="pills" aria-live="polite"></div>
</header>
<main id="chat" aria-live="polite"></main>
<div class="chips">
  <button type="button" data-say="status">Status</button>
  <button type="button" data-say="what's posting next?">What's next?</button>
  <button type="button" data-say="next">Make next video</button>
  <button type="button" data-say="anything broken?">Anything broken?</button>
</div>
<form id="form">
  <label class="sr" for="text">Message</label>
  <input id="text" autocomplete="off" placeholder="Ask or tell me something…">
  <button class="primary" type="submit">Send</button>
</form>
<script>
const $ = (s) => document.querySelector(s);
const chat = $("#chat");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let state = null, shownCards = new Set();

function bubble(text, who = "bot") {
  const d = document.createElement("div");
  d.className = `msg ${who}`;
  d.textContent = text;
  chat.append(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}
async function post(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  return r.json();
}
async function act(body, label) {
  const r = await post("/api/widget/act", body);
  bubble(r.message || r.error || `${label}: done`);
  refresh();
}

// A suggested action from the assistant: shown as a button, run only on a tap.
function suggestion(a) {
  const d = document.createElement("div");
  d.className = "row";
  const b = document.createElement("button");
  b.className = "primary";
  b.textContent = `Do it: ${a.action}${a.key ? ` ${a.key}` : ""}${a.feedback ? ` - "${a.feedback}"` : ""}`;
  b.onclick = () => { d.remove(); act(a, a.action); };
  const no = document.createElement("button");
  no.textContent = "No";
  no.onclick = () => d.remove();
  d.append(b, no);
  chat.append(d);
  chat.scrollTop = chat.scrollHeight;
}

function reviewCard(v) {
  const id = `${v.key}:${v.cut}`;
  if (shownCards.has(id)) return;
  shownCards.add(id);
  const d = document.createElement("div");
  d.className = "card";
  d.innerHTML = `${v.has_video ? `<video controls preload="metadata" src="/video?key=${encodeURIComponent(v.key)}&cut=${v.cut}"></video>` : ""}
    <div class="meta">${esc(v.account)} · ${esc(v.day)} ${esc(v.post_at)} · cut ${v.cut} · AI label ${v.is_aigc ? "ON" : "off"}</div>
    <div class="hook">“${esc(v.hook)}”</div>
    <div class="row">
      <button class="primary" data-a="approve">Approve</button>
      <button data-a="redo">Redo…</button>
      <button data-a="skip">Skip</button>
    </div>`;
  d.querySelectorAll("button").forEach((b) => b.onclick = async () => {
    const a = b.dataset.a;
    let feedback = "";
    if (a === "redo") { feedback = prompt("What should change?") ?? ""; if (!feedback.trim()) return; }
    d.querySelectorAll("button").forEach((x) => (x.disabled = true));
    await act({ action: a, key: v.key, cut: v.cut, feedback }, a);
  });
  chat.append(d);
  chat.scrollTop = chat.scrollHeight;
}

function pill(cls, text) { return `<span class="pill ${cls}"><span class="dot"></span>${esc(text)}</span>`; }
async function refresh() {
  try {
    state = await (await fetch("/api/widget")).json();
  } catch { $("#pills").innerHTML = pill("bad", "desk server unreachable"); return; }
  const s = state, c = s.counts;
  const botOk = s.bot_heartbeat_s != null && s.bot_heartbeat_s < 300;
  $("#pills").innerHTML = [
    s.paused ? pill("warn", "paused") : pill("ok", "running"),
    pill(botOk ? "ok" : "bad", botOk ? "Telegram bot" : "bot down"),
    s.creator ? pill("ok", `making ${s.creator.replace(/-tiktok-/, " ").replace(/-001$/, "")}`) : pill(s.quota_pause ? "warn" : "", s.quota_pause ? "Claude limit" : "creator idle"),
    pill(c.rendered ? "warn" : "", `${c.rendered} to review`),
    c.blocked ? pill("bad", `${c.blocked} blocked`) : "",
    s.attention.length ? pill("bad", `${s.attention.length} upload issue${s.attention.length > 1 ? "s" : ""}`) : "",
    pill("", `${c.approved + c.queued} queued · ${c.posted} posted`),
  ].join("");
  $("#pause").textContent = s.paused ? "Resume" : "Pause";
  s.review.forEach(reviewCard);
}

$("#pause").onclick = () => act({ action: state?.paused ? "resume" : "pause" }, "pause");
async function say(text) {
  bubble(text, "me");
  const t = bubble("…", "bot");
  t.classList.add("typing");
  try {
    const r = await post("/api/chat", { text });
    t.classList.remove("typing");
    t.textContent = r.reply || r.error || "(no answer)";
    if (r.suggest) suggestion(r.suggest);
  } catch { t.textContent = "The desk server didn't answer."; }
  refresh();
}
$("#form").onsubmit = (e) => { e.preventDefault(); const v = $("#text").value.trim(); if (v) { $("#text").value = ""; say(v); } };
document.querySelectorAll("[data-say]").forEach((b) => (b.onclick = () => say(b.dataset.say)));

refresh().then(() => say("status"));
setInterval(refresh, 15_000);
</script>
</body>
</html>
